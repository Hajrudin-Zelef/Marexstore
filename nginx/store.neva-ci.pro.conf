# Marexstore sur store.neva-ci.pro — TLS ajouté par certbot ensuite.
# Volet anti-scraping : user-agents de pompage refusés (444), bons bots
# autorisés, rate-limits séparés pages / API.

limit_req_zone $binary_remote_addr zone=store_pages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=store_api:10m rate=5r/s;

map $http_user_agent $badbot {
    default 0;
    ~*(HTTrack|httrack|webcopier|offline\.explorer|teleport|wget|curl|python-requests|python-urllib|Scrapy|MJ12bot|AhrefsBot|SemrushBot|DotBot|Bytespider|PetalBot|CCBot|GPTBot|ClaudeBot|Imagesift|Applebot-Extended|PerplexityBot|YouBot|Diffbot|DataForSeo|webmeup|masscan|nmap|nikto|sqlmap|ZmEu|asusbrowser) 1;
}

server {
    server_name store.neva-ci.pro;

    # Bons bots d'abord (un spoofeur reste soumis au rate-limit).
    if ($http_user_agent ~* (Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|facebookexternalhit|Twitterbot)) {
        set $badbot 0;
    }
    if ($badbot) {
        return 444;
    }

    location / {
        limit_req zone=store_pages burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        limit_req zone=store_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/store.neva-ci.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/store.neva-ci.pro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = store.neva-ci.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name store.neva-ci.pro;
    listen 80;
    return 404; # managed by Certbot


}
