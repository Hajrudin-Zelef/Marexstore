# nginx vhost store.neva-ci.pro -> marexstore:8080
# Placer dans /etc/nginx/sites-available/store.neva-ci.pro puis ln -s + certbot.
upstream marexstore { server 127.0.0.1:8080; }

server {
  listen 80;
  server_name store.neva-ci.pro;
  # Certbot ajoutera le bloc 443 + HSTS.
  location /static/ {
    proxy_pass http://marexstore;
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location / {
    proxy_pass http://marexstore;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Rate-limit doux : n'ennuie pas l'acheteur normal.
    limit_req zone=store burst=40 nodelay;
    limit_req_status 429;
  }
}
# Requis dans http{} : limit_req_zone $binary_remote_addr zone=store:10m rate=40r/s;
