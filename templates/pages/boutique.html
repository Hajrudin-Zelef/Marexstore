{{define "boutique"}}<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title><link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script></head><body>
<header class="top"><div class="wrap"><a class="logo" href="/">Marexstore</a>
<form class="search" action="/boutique" method="get"><input name="q" value="{{.Q}}" type="search" aria-label="Recherche"><button>Rechercher</button></form>
<nav><a href="/">Accueil</a><a href="/commande">Panier</a></nav></div></header>
<main class="wrap"><h1>Boutique</h1>
<form hx-get="/boutique" hx-target="#list" hx-push-url="true" hx-trigger="submit">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<input name="q" value="{{.Q}}" placeholder="hp 650a, imprimante, wifi…">
<button>Filtrer</button></form>
<div id="list" class="grid">{{range .Products}}{{template "card" .}}{{else}}<p>Aucun produit trouvé.</p>{{end}}</div>
</main></body></html>{{end}}
